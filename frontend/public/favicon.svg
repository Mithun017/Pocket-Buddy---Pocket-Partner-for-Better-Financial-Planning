<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0a0e1a" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#6366f1" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Subtle Internal Glow Grid -->
  <rect x="6" y="6" width="52" height="52" rx="12" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

  <!-- Modern Pocket Buddy Wallet Geometry -->
  <g transform="translate(10, 12)">
    <!-- Main Back Body -->
    <path d="M4 10C4 6.68629 6.68629 4 10 4H36C38.2091 4 40 5.79086 40 8V12H10C7.79086 12 6 13.7909 6 16C6 18.2091 7.79086 20 10 20H40V32C40 35.3137 37.3137 38 34 38H10C6.68629 38 4 35.3137 4 32V10Z" 
          fill="url(#primaryGrad)" />
    
    <!-- Top Flap Detail -->
    <path d="M4 10C4 6.68629 6.68629 4 10 4H36C38.2091 4 40 5.79086 40 8V12H10C7.79086 12 6 13.7909 6 16" 
          fill="none" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round"/>

    <!-- Secure Pocket Lock / Card Module -->
    <rect x="26" y="16" width="16" height="12" rx="4" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
    <circle cx="34" cy="22" r="2.5" fill="url(#accentGrad)" filter="url(#glow)" />
    
    <!-- Upward Growth Dynamic Arrow / Spark -->
    <path d="M12 28L18 22L22 25L28 17" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <polyline points="23 17 28 17 28 22" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
